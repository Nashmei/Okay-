name: Build EOSignal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout EOSignal
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install make ldid

      - name: Setup Theos
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$THEOS/sdks"

          curl -L \
            https://codeload.github.com/theos/sdks/zip/refs/heads/master \
            -o /tmp/theos-sdks.zip

          unzip -q /tmp/theos-sdks.zip -d /tmp

          cp -a /tmp/sdks-master/*.sdk "$THEOS/sdks/"

          echo "Installed SDKs:"
          ls -1 "$THEOS/sdks"

      - name: Show Build Environment
        run: |
          echo "THEOS=$THEOS"
          echo "Project:"
          pwd

          echo "Makefile:"
          cat Makefile

          echo "Sources:"
          find Sources -maxdepth 2 -type f -print

          echo "Available SDKs:"
          ls -lah "$THEOS/sdks"

          echo "Compiler:"
          clang --version

      - name: Build EOSignal dylib
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"
          export PATH="$THEOS/bin:$PATH"

          make clean
          make FINALPACKAGE=1 -j2

      - name: Locate EOSignal dylib
        run: |
          set -e

          echo "Searching build output..."

          find .theos -type f -name "*.dylib" -print || true

          DYLIB_PATH="$(find .theos -type f -name 'EOSignal.dylib' | head -1)"

          if [ -z "$DYLIB_PATH" ] || [ ! -f "$DYLIB_PATH" ]; then
            echo "EOSignal.dylib was not generated."
            echo "Contents of .theos:"
            find .theos -type f -maxdepth 6 -print || true
            exit 1
          fi

          echo "Found: $DYLIB_PATH"

          cp "$DYLIB_PATH" "$GITHUB_WORKSPACE/EOSignal.dylib"

      - name: Inspect dylib
        run: |
          set -e

          echo "File:"
          file EOSignal.dylib

          echo
          echo "Architectures:"
          lipo -info EOSignal.dylib || true

          echo
          echo "Linked libraries:"
          otool -L EOSignal.dylib

          echo
          echo "Deployment information:"
          otool -l EOSignal.dylib | grep -A5 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' || true

          echo
          echo "Size:"
          ls -lh EOSignal.dylib

      - name: Strip EOSignal dylib
        run: |
          set -e

          strip -S EOSignal.dylib || true

          echo "Final dylib:"
          file EOSignal.dylib
          ls -lh EOSignal.dylib

      - name: Upload EOSignal dylib
        uses: actions/upload-artifact@v4
        with:
          name: EOSignal-dylib
          path: EOSignal.dylib
          if-no-files-found: error
          retention-days: 14
