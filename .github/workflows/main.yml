name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: brew install ldid make

    - name: Setup Theos
      run: |
        echo "THEOS=$PWD/theos" >> $GITHUB_ENV
        if [ ! -d "theos" ]; then
          git clone --recursive https://github.com/theos/theos.git
        fi
        mkdir -p theos/sdks
        if [ ! -d "theos/sdks/iPhoneOS16.5.sdk" ]; then
          curl -L https://codeload.github.com/theos/sdks/zip/refs/heads/master -o sdks.zip
          unzip -q sdks.zip -d theos/
          mv theos/sdks-master/* theos/sdks/
          rm -rf theos/sdks-master sdks.zip
        fi

    - name: Build Tweak
      run: |
        export THEOS=$PWD/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Extract dylib from deb (Rootless path)
      run: |
        # 1. العثور على ملف deb
        DEB_FILE=$(ls packages/*.deb | head -n 1)
        echo "📦 Found deb: $DEB_FILE"
        
        # 2. استخراج محتويات deb يدوياً
        mkdir -p deb_extract
        cd deb_extract
        
        # استخراج data.tar.lzma أو data.tar.xz
        ar x ../$DEB_FILE
        
        # فك ضغط الملف المناسب
        if [ -f data.tar.lzma ]; then
          tar -xf data.tar.lzma
        elif [ -f data.tar.xz ]; then
          tar -xf data.tar.xz
        elif [ -f data.tar.gz ]; then
          tar -xzf data.tar.gz
        else
          echo "⚠️  No known data.tar format found"
          exit 1
        fi
        
        cd ..
        
        # 3. البحث عن الـ dylib في المسارات المحتملة
        DYLIB_PATH=""
        
        # المسار الأول: Rootless (var/jb)
        if [ -f "deb_extract/var/jb/Library/MobileSubstrate/DynamicLibraries/kammelnaTweak.dylib" ]; then
          DYLIB_PATH="deb_extract/var/jb/Library/MobileSubstrate/DynamicLibraries/kammelnaTweak.dylib"
          echo "✅ Found dylib in var/jb/ path"
        # المسار الثاني: Rootful (Library)
        elif [ -f "deb_extract/Library/MobileSubstrate/DynamicLibraries/kammelnaTweak.dylib" ]; then
          DYLIB_PATH="deb_extract/Library/MobileSubstrate/DynamicLibraries/kammelnaTweak.dylib"
          echo "✅ Found dylib in Library/ path"
        # المسار الثالث: البحث العام
        else
          echo "🔍 Searching for dylib in extracted files..."
          find deb_extract -name "*.dylib" -type f 2>/dev/null | head -5
          DYLIB_PATH=$(find deb_extract -name "kammelnaTweak.dylib" -type f 2>/dev/null | head -1)
        fi
        
        # 4. نسخ الـ dylib إلى مكان العمل
        if [ -n "$DYLIB_PATH" ] && [ -f "$DYLIB_PATH" ]; then
          cp "$DYLIB_PATH" ./kammelnaTweak.dylib
          echo "✅ dylib copied successfully from: $DYLIB_PATH"
        else
          echo "❌ Could not find kammelnaTweak.dylib anywhere"
          echo "🔍 Contents of deb_extract:"
          ls -la deb_extract/
          echo "🔍 Searching all files..."
          find deb_extract -type f 2>/dev/null | head -30
          exit 1
        fi
        
        # 5. تنظيف الصلاحيات والتوقيع
        echo "🔧 Cleaning entitlements and signature..."
        codesign --remove-signature kammelnaTweak.dylib || true
        ldid -S kammelnaTweak.dylib || true
        strip -S kammelnaTweak.dylib || true
        
        # 6. التحقق من النظافة
        codesign -d kammelnaTweak.dylib 2>/dev/null && echo "⚠️  Still signed!" || echo "✅ dylib is clean (not signed)"
        
        # 7. عرض حجم الملف للتأكد
        ls -la kammelnaTweak.dylib

    - name: Upload Clean dylib
      uses: actions/upload-artifact@v4
      with:
        name: kammelnaTweak_clean.dylib
        path: ./kammelnaTweak.dylib

    - name: Upload deb (optional)
      uses: actions/upload-artifact@v4
      with:
        name: kammelnaTweak.deb
        path: ./packages/*.deb
